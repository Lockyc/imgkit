name: CI

on:
  # A main-only repo pushes to main on every commit, so CI runs at release
  # (the v* tag) and on PRs. `just gate` is the local check; run it on main
  # on demand with `gh workflow run ci.yml`.
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt check
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags quality ./quality/

      - name: go test
        run: go test ./...
